<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Mercedes-Benz</title>
</head>

<body>

    <main>

        <!-- LEFT SIDE -->
        <section>

            <h1>Mercedes-Benz</h1>

            <p>Welcome to your world</p>

            <h2>Designed around you.</h2>

            <p>
                One account for your Mercedes-Benz experience.
            </p>

        </section>


        <section>

            <p>Mercedes me ID</p>

            <h2>Sign in</h2>

            <p>
                Access your vehicle, services and connected experience.
            </p>


            <form>

                <label for="email">
                    Email address
                </label>

                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="name@example.com"
                    required
                >

                <br><br>


                <label for="password">
                    Password
                </label>

                <br>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <br><br>


                <label>
                    <input
                        type="checkbox"
                        name="remember"
                    >

                    Stay signed in
                </label>

                <br><br>


                <button type="button">
                    Forgot password?
                </button>

                <br><br>


                <button type="submit">
                    Sign in
                </button>

            </form>


            <hr>


            <p>
                NEW TO MERCEDES-BENZ?
            </p>

            <p>
                Create your Mercedes me ID

                <button type="button">
                    Register
                </button>
            </p>


            <footer>

                <a href="#">
                    Privacy
                </a>

                <a href="#">
                    Legal notice
                </a>

                <a href="#">
                    Cookie settings
                </a>

            </footer>

        </section>

    </main>

</body>

</html>
