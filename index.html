<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111315">
  <title>Sign in | Mercedes-Benz</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17191b;
      --muted: #707478;
      --line: #d9dcde;
      --paper: #fff;
      --accent: #b3132b;
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Helvetica Neue", Helvetica, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    .page {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(420px, .88fr);
      min-height: 100vh;
    }

    .visual {
      position: relative;
      display: flex;
      min-height: 680px;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 42px 5.2vw 44px;
      background: #232629;
      color: white;
    }

    .visual::after {
      position: absolute;
      z-index: 0;
      background: linear-gradient(180deg, rgb(0 0 0 / 30%) 0%, transparent 34%, rgb(0 0 0 / 57%) 100%);
      content: "";
      inset: 0;
    }

    .visual-image {
      position: absolute;
      width: 100%;
      height: 100%;
      inset: 0;
      object-fit: cover;
      object-position: center;
    }

    .visual-top, .visual-copy { position: relative; z-index: 1; }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      color: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-decoration: none;
    }

    .star-mark {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 34px;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .star-mark::before {
      position: absolute;
      inset: 5px;
      background: currentColor;
      clip-path: polygon(48% 0, 54% 0, 53% 44%, 92% 20%, 96% 25%, 58% 49%, 94% 76%, 91% 81%, 53% 58%, 50% 100%, 45% 100%, 47% 57%, 9% 81%, 5% 76%, 42% 49%, 5% 25%, 9% 20%, 47% 44%);
      content: "";
    }

    .visual-copy { max-width: 470px; }

    .eyebrow {
      margin: 0 0 15px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.3px;
      text-transform: uppercase;
    }

    .visual-copy h1 {
      max-width: 430px;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(40px, 5.1vw, 70px);
      font-weight: 400;
      line-height: 1.03;
    }

    .visual-copy p:last-child {
      max-width: 335px;
      margin: 18px 0 0;
      color: rgb(255 255 255 / 79%);
      font-size: 14px;
      line-height: 1.65;
    }

    .panel {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      justify-content: center;
      padding: 55px clamp(36px, 7.4vw, 112px);
    }

    .panel .wordmark { margin-bottom: 66px; color: var(--ink); }
    .panel .star-mark { width: 31px; height: 31px; }

    .form-wrap { width: 100%; max-width: 390px; margin: 0 auto; }

    .form-kicker {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 42px;
      font-weight: 400;
      line-height: 1.1;
    }

    .intro {
      margin: 14px 0 34px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .field { margin-bottom: 21px; }

    .field label {
      display: block;
      margin-bottom: 9px;
      font-size: 12px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      height: 51px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 2px;
      outline: none;
      background: white;
      color: var(--ink);
      font-size: 14px;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .field input::placeholder { color: #9b9fa2; }
    .field input:focus { border-color: #555b5f; box-shadow: 0 0 0 3px rgb(23 25 27 / 8%); }

    .password-box { position: relative; }
    .password-box input { padding-right: 72px; }

    .reveal {
      position: absolute;
      top: 0;
      right: 0;
      height: 51px;
      padding: 0 14px;
      border: 0;
      background: transparent;
      color: #555b5f;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 0 27px;
      font-size: 12px;
    }

    .remember { display: inline-flex; align-items: center; gap: 9px; color: #4d5256; }
    .remember input { width: 15px; height: 15px; margin: 0; accent-color: var(--ink); }

    a, .text-button {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: #a9adaf;
      text-underline-offset: 3px;
    }

    a:hover, .text-button:hover { text-decoration-color: var(--accent); }

    .text-button {
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      font-size: inherit;
    }

    .submit {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--ink);
      border-radius: 2px;
      background: var(--ink);
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      transition: background 160ms ease, color 160ms ease;
    }

    .submit:hover { background: white; color: var(--ink); }
    .message { min-height: 21px; margin: 13px 0 0; color: #4d5256; font-size: 12px; line-height: 1.5; }

    .divider { display: flex; align-items: center; gap: 15px; margin: 21px 0; color: #92979a; font-size: 10px; }
    .divider::before, .divider::after { height: 1px; flex: 1; background: #e5e7e8; content: ""; }

    .register { margin: 0; color: var(--muted); text-align: center; font-size: 12px; }
    .register .text-button { margin-left: 4px; font-weight: 600; }

    .legal {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin-top: 54px;
      color: #777c80;
      font-size: 10px;
    }

    .legal a { color: inherit; text-decoration: none; }
    .legal a:hover { color: var(--ink); }

    @media (max-width: 850px) {
      .page { grid-template-columns: minmax(0, 1fr) minmax(370px, .92fr); }
      .visual { padding-right: 36px; padding-left: 36px; }
      .panel { padding-right: 38px; padding-left: 38px; }
    }

    @media (max-width: 680px) {
      .page { display: flex; flex-direction: column; }
      .visual { min-height: 290px; padding: 23px 25px 29px; }
      .visual-copy h1 { max-width: 360px; font-size: 42px; }
      .visual-copy p:last-child { display: none; }
      .eyebrow { margin-bottom: 9px; }
      .panel { min-height: auto; padding: 34px 25px 25px; }
      .panel .wordmark { display: none; }
      .form-wrap { max-width: 440px; }
      h2 { font-size: 37px; }
      .intro { margin-bottom: 27px; }
      .legal { margin-top: 37px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="visual" aria-label="Mercedes-Benz">
      <img class="visual-image" src="https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?auto=format&fit=crop&w=1800&q=85" alt="Mercedes-Benz vehicle on the road">
      <div class="visual-top">
        <a class="wordmark" href="#home" aria-label="Mercedes-Benz home">
          <span class="star-mark" aria-hidden="true"></span>
          <span>Mercedes-Benz</span>
        </a>
      </div>
      <div class="visual-copy">
        <p class="eyebrow">Welcome to your world</p>
        <h1>Designed around you.</h1>
        <p>One account for your Mercedes-Benz experience.</p>
      </div>
    </section>

    <section class="panel" aria-labelledby="form-title">
      <a class="wordmark" href="#home" aria-label="Mercedes-Benz home">
        <span class="star-mark" aria-hidden="true"></span>
        <span>Mercedes-Benz</span>
      </a>

      <div class="form-wrap">
        <p class="form-kicker">Mercedes me ID</p>
        <h2 id="form-title">Sign in</h2>
        <p class="intro">Access your vehicle, services and connected experience.</p>

        <form id="login-form">
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="name@example.com" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-box">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="6">
              <button class="reveal" id="toggle-password" type="button" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember"><input type="checkbox" name="remember"> <span>Stay signed in</span></label>
            <button class="text-button" id="forgot-password" type="button">Forgot password?</button>
          </div>

          <button class="submit" type="submit">Sign in</button>
          <p class="message" id="form-message" role="status" aria-live="polite"></p>
        </form>

        <div class="divider">NEW TO MERCEDES-BENZ?</div>
        <p class="register">Create your Mercedes me ID <button class="text-button" id="register" type="button">Register</button></p>
      </div>

      <footer class="legal">
        <a href="#privacy">Privacy</a>
        <a href="#legal">Legal notice</a>
        <a href="#cookies">Cookie settings</a>
      </footer>
    </section>
  </main>

  <script>
    const form = document.querySelector('#login-form');
    const email = document.querySelector('#email');
    const password = document.querySelector('#password');
    const message = document.querySelector('#form-message');
    const togglePassword = document.querySelector('#toggle-password');

    togglePassword.addEventListener('click', () => {
      const isVisible = password.type === 'text';
      password.type = isVisible ? 'password' : 'text';
      togglePassword.textContent = isVisible ? 'Show' : 'Hide';
      togglePassword.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
      togglePassword.setAttribute('aria-pressed', String(!isVisible));
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      message.textContent = 'Demo only: connect this form to your authentication service to sign in.';
    });

    document.querySelector('#forgot-password').addEventListener('click', () => {
      message.textContent = email.value
        ? `Password recovery for ${email.value} is not connected in this demo.`
        : 'Enter your email address above to continue with password recovery.';
      if (!email.value) email.focus();
    });

    document.querySelector('#register').addEventListener('click', () => {
      message.textContent = 'Account registration is not connected in this demo.';
    });
  </script>
</body>
</html>
